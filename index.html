<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      if (location.pathname.endsWith("/assets/") || location.pathname.endsWith("/assets/index.html")) {
        location.replace(new URL("../", location.href));
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#26357a" />
    <meta name="description" content="Organize seus treinos, registre cargas e acompanhe sua evolução." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ritmo" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Ritmo — treino</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      if (import.meta.env.DEV && "serviceWorker" in navigator) {
        await Promise.all((await navigator.serviceWorker.getRegistrations()).map((registration) => registration.unregister()));
        await Promise.all((await caches.keys()).filter((key) => key.startsWith("ritmo-pwa-")).map((key) => caches.delete(key)));
      }
      await import("/src/main.tsx");
    </script>
  </body>
</html>
